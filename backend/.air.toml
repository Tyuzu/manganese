root = "."

tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/dolomite-server ."
  bin = "./tmp/dolomite-server"
  include_ext = ["go", "mod", "sum"]
  exclude_dir = ["tmp", "vendor"]
  delay = 1000

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "green"
  runner = "blue"
